name: Build & Release APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Set version
        run: |
          BASE="$(tr -d '[:space:]' < VERSION)"
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          # main 브랜치에서 VERSION 파일의 버전으로 아직 릴리스가 없으면 새 릴리스를 만든다
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" && "$GITHUB_REF" == "refs/heads/main" ]] \
             && ! gh release view "v${BASE}" >/dev/null 2>&1; then
            echo "VERSION_NAME=${BASE}" >> "$GITHUB_ENV"
            echo "RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=${BASE}-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Test (동기화 합치기 규칙 · 기존 기록 보존)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testGeneralDebugUnitTest testCatholicDebugUnitTest

      - name: Build debug APKs (천주교인용 + 일반용)
        run: |
          ./gradlew --no-daemon assembleCatholicDebug assembleGeneralDebug
          mkdir -p dist
          cp app/build/outputs/apk/catholic/debug/app-catholic-debug.apk "dist/DailyHabit-Catholic-${VERSION_NAME}.apk"
          cp app/build/outputs/apk/general/debug/app-general-debug.apk "dist/DailyHabit-${VERSION_NAME}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: DailyHabit-${{ env.VERSION_NAME }}
          path: dist/*.apk

      - name: Release 일반용
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          name: DailyHabit v${{ env.VERSION_NAME }}
          files: dist/DailyHabit-${{ env.VERSION_NAME }}.apk
          make_latest: "true"
          body: |
            ## DailyHabit v${{ env.VERSION_NAME }} (일반용)
            - 오늘의 명언 (한국어 · 영어)
            - 앞으로 7일 구글 캘린더 일정
            - 할 일 · 매일 루틴(알림 · 체크 · 통계) · 맛집 리스트
            - 한 줄 일기 · 독서 기록(밑줄·메모)
            - 맛집 방문 기록(날짜 수정·사진) · 방문 달력 · 동네별 지도 보기
            - 월간 돌아보기 · 감사 일기 모음 · 독서 목표
            - 일기·맛집 엑셀 저장, 새 버전 알림
            - 백업 파일로 저장·복원, 앱 정보에서 업데이트 확인·설치
            - 루틴 간단히 보기 (한 줄에 두 개, 기본값)
            - 원하는 시각의 아침 알림 (오늘 일정 · 루틴)
            - PC와 동기화 (같은 와이파이) — 윈도우 DailyHabit v1.8.0의 QR 코드를 설정 → PC와 동기화에서 찍으면 짝이 맺어지고, 할 일·루틴·일기·맛집(사진 포함)·독서·장보기가 서로 맞춰집니다. 서버·계정 없이 직접 주고받고 암호화합니다.
            - 뒤로 가기로 직전 화면으로 돌아가기 (메뉴에서 한 번 더 누르면 앱이 닫힘)
            - **새로: 앱 정보에 사용 방법 · 만든이**

            **설치:** `DailyHabit-${{ env.VERSION_NAME }}.apk`를 휴대폰에서 내려받아 설치하세요.
            천주교 기능(오늘의 복음 · 기도)이 필요하면 **DailyHabit 천주교인용** 릴리스를 받으세요.

      - name: Release 천주교인용
        if: env.RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}-catholic
          target_commitish: ${{ github.sha }}
          name: DailyHabit 천주교인용 v${{ env.VERSION_NAME }}
          files: dist/DailyHabit-Catholic-${{ env.VERSION_NAME }}.apk
          make_latest: "false"
          body: |
            ## DailyHabit 천주교인용 v${{ env.VERSION_NAME }}
            - 오늘의 복음 (매일미사) · 주요 기도문 (가톨릭 기도서) · 오늘의 묵주기도 신비
            - 앞으로 7일 구글 캘린더 일정
            - 할 일 · 매일 루틴(알림 · 체크 · 통계) · 맛집 리스트
            - 한 줄 일기 · 독서 기록(밑줄·메모)
            - 백업 파일로 저장·복원, 앱 정보에서 업데이트 확인·설치
            - 오늘의 말씀 읽기·기도하기 루틴 자동 체크, 루틴 간단히 보기 (기본값)
            - 맛집 방문 기록(날짜 수정·사진) · 방문 달력 · 동네별 지도 보기
            - 월간 돌아보기 · 감사 일기 모음 · 독서 목표
            - 일기·맛집 엑셀 저장, 새 버전 알림
            - 원하는 시각의 아침 알림 (복음 요약 · 오늘 일정)
            - PC와 동기화 (같은 와이파이) — 윈도우 DailyHabit 천주교인용 v1.8.0의 QR 코드를 설정 → PC와 동기화에서 찍으면 짝이 맺어지고, 할 일·루틴·일기·맛집(사진 포함)·독서·장보기가 서로 맞춰집니다. 서버·계정 없이 직접 주고받고 암호화합니다.
            - 뒤로 가기로 직전 화면으로 돌아가기 (메뉴에서 한 번 더 누르면 앱이 닫힘)
            - **새로: 오늘의 말씀에 독서 · 화답송 · 복음 환호송** — 제1독서, 화답송, 제2독서(주일·대축일), 복음 환호송, 복음을 미사 순서대로 보여 주고, 위쪽 버튼으로 한 부분만 골라 볼 수 있습니다.
            - **새로: 성월 기도** — 성 요셉(3월) · 성모(5월) · 예수 성심(6월) · 순교자(9월) · 묵주 기도(10월) · 위령(11월) 성월 기도 (가톨릭 기도서). 성월에는 기도 화면 위에 ‘이달의 성월’이 나옵니다.
            - **새로: 가톨릭 성가** — 번호나 제목으로 찾고, 가사가 적힌 악보(단성 · 혼성)와 가사를 봅니다. 악보는 눌러서 크게 볼 수 있고, 한 번 연 곡은 인터넷 없이도 보입니다.
            - 앱 정보에 사용 방법 · 만든이 추가, 오늘의 말씀 전례일 표시 바로잡음

            **설치:** `DailyHabit-Catholic-${{ env.VERSION_NAME }}.apk`를 휴대폰에서 내려받아 설치하세요.
            이전 버전(v1.0~v1.8.1)을 쓰고 있다면 이 버전으로 덮어 설치하면 데이터가 그대로 이어집니다.
